[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydsa-lite"
version = "0.1.0"
description = "A beginner-friendly Python library for learning data structures and algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["data-structures", "algorithms", "education"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Intended Audience :: Education", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Education"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mkdocs>=1.6", "mkdocs-material>=9.5"]

[tool.setuptools.packages.find]
include = ["pydsa_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
