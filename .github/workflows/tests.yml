name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run structure examples
        run: |
          python examples/structures/linked_lists.py
          python examples/structures/stack.py
          python examples/structures/queue.py
          python examples/structures/hash_table.py
          python examples/structures/binary_search_tree.py
          python examples/structures/min_heap.py
          python examples/structures/graph.py
